server {
    listen 80;
    server_name _;

    client_max_body_size 200M;

    # Serve static via FastAPI mount to avoid path drift between deployments.
    # This keeps templates and static URL generation consistent across environments.
    location /static/ {
        proxy_pass http://127.0.0.1:4200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Raw storage must never be served directly; originals go through /media/ in app.
    location /storage/ {
        return 403;
    }

    location / {
        proxy_pass http://127.0.0.1:4200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 300;
    }
}
